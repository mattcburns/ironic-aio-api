services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  api:
    build:
      context: ../
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    environment:
      - IRONIC_AIO_IRONIC_BASIC_AUTH_USERNAME=${IRONIC_AIO_IRONIC_BASIC_AUTH_USERNAME:-admin}
      - IRONIC_AIO_IRONIC_BASIC_AUTH_PASSWORD=${IRONIC_AIO_IRONIC_BASIC_AUTH_PASSWORD}
      - IRONIC_AIO_IRONIC_SKIP_CA_VERIFICATION=${IRONIC_AIO_IRONIC_SKIP_CA_VERIFICATION:-true}
      - IRONIC_AIO_IRONIC_API_URL=${IRONIC_AIO_IRONIC_API_URL:-http://ironic:6385/v1}
      - IRONIC_AIO_IRONIC_API_VERSION=${IRONIC_AIO_IRONIC_API_VERSION:-1}
      - IRONIC_AIO_KERNEL_URL=${IRONIC_AIO_KERNEL_URL}
      - IRONIC_AIO_RAMDISK_URL=${IRONIC_AIO_RAMDISK_URL}
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 8000

volumes:
  ollama: {}
  open-webui: {}
